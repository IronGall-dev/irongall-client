# The gate AGENTS.md lists before every push, run on every push to main and
# every pull request, so each commit's result is on the public record, and
# once a day, when the fuzz targets run longer and govulncheck meets
# advisories published since. Actions are pinned by commit, each with its
# release beside it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's newer push cancels its older run; every other run is its own.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    # Two OpenSSH releases for the script and the cross-tests: 9.6p1 and 10.2p1.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: tools
        run: |
          go version; ssh -V; jq --version; curl --version | head -1; bash --version | head -1
      - name: check
        # gofmt, vet, every test (a skip fails the job, since this runner has
        # every tool), and the race test: scripts/check.sh, which a laptop runs too.
        run: scripts/check.sh full

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: scripts/check.sh vuln

  fuzz:
    # Every fuzz target, each alone: briefly on a push, longer once a day, from
    # the corpus the daily runs have grown.
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ github.event_name == 'schedule' && 240 || 30 }}
    env:
      FUZZTIME: ${{ github.event_name == 'schedule' && '10m' || '20s' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ github.run_id }}
          restore-keys: fuzz-
      - name: fuzz
        run: |
          go test -list '^Fuzz' ./... | awk '/^Fuzz/ { n[++k] = $1; next } /^ok/ { for (i = 1; i <= k; i++) print $2, n[i]; k = 0 }' > "$RUNNER_TEMP/targets"
          [ -s "$RUNNER_TEMP/targets" ] || { echo "::error::no fuzz target listed"; exit 1; }
          cat "$RUNNER_TEMP/targets"
          while read -r pkg name; do
            go test -run '^$' -fuzz "^$name\$" -fuzztime "$FUZZTIME" "$pkg"
          done < "$RUNNER_TEMP/targets"
      - name: the failing input
        # go test writes it under the package's testdata/fuzz/, where a fix keeps it as a seed.
        if: failure()
        run: git ls-files --others --exclude-standard -- '*testdata/fuzz/*' | xargs -r tail -n +1

  server:
    # irongall-server builds against this checkout (its go.mod replaces the
    # client module with ../irongall-client), so a change here is a change there.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: irongall-client
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: IronGall-dev/irongall-server
          path: irongall-server
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            irongall-client/go.sum
            irongall-server/go.sum
      - name: check
        # irongall-server's own scripts/check.sh: its tests and test/interop.sh, against this commit
        working-directory: irongall-server
        run: scripts/check.sh full
