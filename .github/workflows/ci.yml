# The gate AGENTS.md lists before every push, run on every push to main and
# every pull request, so each commit's result is on the public record, and
# once a day, when govulncheck meets advisories published since. The fuzz
# targets run once a week, an hour each, or by hand. release.yml runs it all
# again on a release's tag before it builds (workflow_call). Actions are
# pinned by commit, each with its release beside it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * *"
    - cron: "47 6 * * 0" # the weekly fuzz run
  workflow_dispatch:
    inputs:
      fuzztime:
        description: how long each fuzz target runs
        default: 60m
  workflow_call:

permissions:
  contents: read

concurrency:
  # A pull request's newer push cancels its older run; every other run is its own.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    # Ubuntu on two OpenSSH releases for the script and the cross-tests, 9.6p1
    # and 10.2p1, and on arm64; macOS on Apple silicon, and on Intel in the
    # daily run and release.yml's alone (a tag's and its hand-run), since that runner is the slowest and
    # once stalled with no log; Windows on x64 and arm64, in Git's bash: each
    # system and architecture a release is built for. On macOS and Windows
    # scripts/check.sh leaves ./sh out (its header says why).
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.workflow == 'release') && '["ubuntu-24.04","ubuntu-26.04","ubuntu-26.04-arm","macos-26","macos-26-intel","windows-2025","windows-11-arm"]' || '["ubuntu-24.04","ubuntu-26.04","ubuntu-26.04-arm","macos-26","windows-2025","windows-11-arm"]') }}
    runs-on: ${{ matrix.os }}
    # Twice a run's usual length: a hang is caught sooner by scripts/check.sh's
    # timeout for one package, which prints what it waits for.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: tools
        run: |
          go version; ssh -V; jq --version; curl --version | head -1; bash --version | head -1
      - name: check
        # gofmt, vet, every test (a skip fails the job, since this runner has
        # every tool), and the race test: scripts/check.sh, which a laptop runs too.
        run: scripts/check.sh full

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - run: scripts/check.sh vuln

  fuzz-targets:
    # The fuzz targets, listed from the code: once a week, or by hand, never on
    # a push, a pull request, the daily run or a call from release.yml (whose
    # own event a called workflow sees: so the workflow's name, ci, is
    # checked). In two weeks of daily and per-push runs fuzzing found no
    # defect, so it runs long and seldom.
    if: github.event.schedule == '47 6 * * 0' || (github.event_name == 'workflow_dispatch' && github.workflow == 'ci')
    runs-on: ubuntu-26.04
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - id: list
        run: |
          go test -list '^Fuzz' ./... | awk '/^Fuzz/ { n[++k] = $1; next } /^ok/ { for (i = 1; i <= k; i++) print $2, n[i]; k = 0 }' > "$RUNNER_TEMP/targets"
          [ -s "$RUNNER_TEMP/targets" ] || { echo "::error::no fuzz target listed"; exit 1; }
          cat "$RUNNER_TEMP/targets"
          echo "targets=$(jq -R -s -c 'split("\n") | map(select(length > 0) | split(" ") | {pkg: .[0], name: .[1]})' "$RUNNER_TEMP/targets")" >> "$GITHUB_OUTPUT"

  fuzz:
    # Each target in a job of its own, an hour, at most six at once: the org's
    # plan runs 20 jobs at a time, and a job at most six hours. From the corpus
    # earlier runs have grown.
    needs: fuzz-targets
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    name: fuzz (${{ matrix.target.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      FUZZTIME: ${{ inputs.fuzztime || '60m' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ matrix.target.name }}-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target.name }}-
            fuzz-
      - name: fuzz
        env:
          PKG: ${{ matrix.target.pkg }}
          NAME: ${{ matrix.target.name }}
        run: go test -run '^$' -fuzz "^$NAME\$" -fuzztime "$FUZZTIME" "$PKG"
      - name: the failing input
        # go test writes it under the package's testdata/fuzz/, where a fix keeps it as a seed.
        if: failure()
        run: git ls-files --others --exclude-standard -- '*testdata/fuzz/*' | xargs -r tail -n +1

  server:
    # dromas-server builds against this checkout (its go.mod replaces the
    # client module with ../dromas-client), so a change here is a change there.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: dromas-client
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dromas-dev/dromas-server
          path: dromas-server
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            dromas-client/go.sum
            dromas-server/go.sum
      - name: check
        # dromas-server's own scripts/check.sh: its tests and test/interop.sh, against this commit
        working-directory: dromas-server
        run: scripts/check.sh full
