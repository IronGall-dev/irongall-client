openapi: 3.1.0
info:
  title: irongall
  version: v1-pre-stable
  summary: The HTTP layer of the irongall protocol, v1, before it is declared stable.
  description: |
    The routes, members, statuses and headers of an irongall server, as
    `PROTOCOL.md` in this repository specifies them. `PROTOCOL.md` is the
    specification: where the two differ, it governs and this file is wrong.

    **This file describes transport only, and nothing in it protects a
    message.** The identity documents, certificates, prekey statements,
    passes, signatures and age files it carries are byte formats, here opaque
    (base64 inside JSON, and a message's ciphertext the body itself), and every check a client makes on them is in `PROTOCOL.md` (§2 to
    §6), with its test vectors in `testdata/vectors/`. A client built from this
    file alone checks nothing, so it trusts the server, which the protocol is
    built never to need. Use the Go client in this repository, or build to
    `PROTOCOL.md`.

    It describes a mailbox server, which is also a revocation server
    (§6.3): it answers both `PUT` and `GET /v1/<addr>/revocations`. A server
    that is only a revocation server answers those two routes alone.

    No server publishes this file at a URL. It is for reading the API in one
    place, and for the tests that hold the reference server and this
    repository's fake server to it (`api/apitest`).

    **What every answer under `/v1/` shares** (`PROTOCOL.md` §13):
    - `Date`, by the clock the server's checks read, and `Cache-Control: no-store`.
    - An error body is RFC 9457 Problem Details in AEP-193's form. A client
      reads `code` and the members, never `detail`, `hint` or `title`. A code
      counts only when the client knows it, under its own status, and `type`
      is that code's own; otherwise the answer is read by its status.
    - Every JSON text is read by `PROTOCOL.md` §0b's rules: I-JSON, one object,
      names matched exactly, nested at most 32 deep, integers from 0 to
      2^53 − 1 written in digits alone, byte members standard base64 in its one
      encoding (padded, the unused bits of the last character zero), and null
      the same as leaving a member out.
    - A server refuses a member or a query parameter it does not know in what
      it is sent, and one given twice (`400 bad_request`, naming it in
      `member`); a client ignores an answer member it does not know. A new v1
      member is optional (§0a).
    - A message's ciphertext is the body itself, `application/octet-stream`,
      on a send and on a fetch (§4.5).
    - An unknown route gets the router's plain `404` or `405`, with no code.
      A server may add routes inside v1, and a client reads that answer as a
      route this server does not offer (§0a).
  license:
    name: Apache-2.0
    identifier: Apache-2.0

security:
  - pass: []

tags:
  - name: box
    description: Registering a box, and the one read of everything a sender needs about it (§3, §4.1).
  - name: messages
    description: Sending, listing, fetching and acking mail (§4.5, §5).
  - name: owner
    description: What a box's owner manages with its pass (§6).
  - name: revocation
    description: Revocations of an address and of its certificates (§6.3, §6.3a). No pass is needed.
  - name: link
    description: The page a box's link opens (§2).

paths:
  /v1/{addr}:
    parameters:
      - $ref: '#/components/parameters/addr'
    get:
      tags: [box]
      operationId: getBox
      summary: Everything a sender needs about a box
      description: |
        `PROTOCOL.md` §4.1. One read: the identity document, the current
        prekey statement with its signature, the key types the box's client
        verifies, and the revocation of its certificates this server holds.
        Nothing in it is trusted until checked: the document against the
        address, the signature's certificate against the document, the
        statement against the certificate, and the revocation against the
        identity (§6.3a). A revoked address is `410 revoked`, with the record
        held in `record`, which a client checks and never believes (§6.3).
        With a pass the call is counted against the box that asks; with none,
        against the address it comes from (§8). Both clients send none.
        Answered for an active box: a
        deleted one, and an address with no box, are `404`.
      security:
        - {}
        - pass: []
      responses:
        '200':
          description: The box, as its identity and working key signed it, and what the server says of its key types.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Content-Encoding:
              $ref: '#/components/headers/Content-Encoding'
            Vary:
              $ref: '#/components/headers/Vary'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: '`revoked`, with the revocation record this server holds in `record`.'
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - required: [record]
                    properties:
                      status:
                        const: 410
                      code:
                        const: revoked
                      record:
                        $ref: '#/components/schemas/RevokedRecord'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      tags: [box]
      operationId: register
      summary: Register a box
      description: |
        `PROTOCOL.md` §3. The pass is under the certificate of the prekey
        statement the body brings, not under one on record. A registration
        never changes a registered box: an identical retry is `200`, anything
        else `409 conflict`. It is held to what the server keeps of the
        address, box or none: `410` while it is revoked, `401
        certificate_revoked` under a certificate its identity revoked, and,
        while the record of a box its owner deleted is kept, a later
        certificate than that box's last and a key it never published. Such a
        registration undoes the delete, `201`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '201':
          $ref: '#/components/responses/Done'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [owner]
      operationId: deleteBox
      summary: Delete a box
      description: |
        `PROTOCOL.md` §6.2. The box is then answered as if it had never been
        registered, and its unacked mail is deleted at once. The server keeps
        its record until its newest certificate ends, and a registration
        until then undoes the delete (§3).
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/{addr}/prekey:
    parameters:
      - $ref: '#/components/parameters/addr'
    put:
      tags: [owner]
      operationId: renew
      summary: Publish a new prekey
      description: |
        `PROTOCOL.md` §6.4. The pass is under the certificate the new
        statement is signed under: a statement ordered after the current one
        (§2b) is the authority, so a box that lost its working key comes back
        this way. A deleted box, and one the server has forgotten, are `404`:
        each comes back by a registration (§3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrekeyRequest'
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/{addr}/revocations:
    parameters:
      - $ref: '#/components/parameters/addr'
    get:
      tags: [revocation]
      operationId: revocations
      summary: Read the revocations held
      description: |
        `PROTOCOL.md` §6.3, a revocation server's read, which every mailbox
        server answers too: the record held of the address, whether or not it
        has a box there, or `404 not_revoked`. It takes no pass, and is
        counted against the address it comes from (§8). A box's own clients
        learn the same from the read of the box; this is for a client that
        lists the server among its revocation servers.
      security: []
      responses:
        '200':
          description: The record held, which proves itself and names its type first.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevocationRecordAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      tags: [revocation]
      operationId: revoke
      summary: Publish a revocation
      description: |
        `PROTOCOL.md` §6.3, §6.3a. The record proves itself, so no pass is
        taken. It is kept with or without a box: for an address registered,
        deleted, forgotten or never registered. A revocation of the address is
        `201`; a revocation of certificates taken, or one through the same
        serial again, `200`; beside a revocation of the address, one no higher
        than the one held changes nothing, and the answer is `201`. An address
        already revoked is `410`, answered from the record before any
        signature in the body is checked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevocationRecord'
      responses:
        '200':
          $ref: '#/components/responses/Done'
        '201':
          $ref: '#/components/responses/Done'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/{addr}/acl:
    parameters:
      - $ref: '#/components/parameters/addr'
    put:
      tags: [owner]
      operationId: putACL
      summary: Replace the box's ACL
      description: |
        `PROTOCOL.md` §6.2: whom the server takes the box's mail from,
        replaced whole by a higher `version`. Mail held from a sender the new
        `deny` matches is deleted with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ACLRequest'
      responses:
        '200':
          $ref: '#/components/responses/ACL'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [owner]
      operationId: getACL
      summary: The box's ACL
      description: |
        `PROTOCOL.md` §6.2. A box with none answers
        `{"version":0,"allow":["*"],"deny":[]}`, which is what none means.
      responses:
        '200':
          $ref: '#/components/responses/ACL'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/{addr}/account:
    parameters:
      - $ref: '#/components/parameters/addr'
    put:
      tags: [owner]
      operationId: adopt
      summary: Join an account with an adopt key
      description: '`PROTOCOL.md` §6.5. A box in another account moves.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptRequest'
      responses:
        '200':
          description: The account the box now belongs to.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [owner]
      operationId: leave
      summary: Leave the box's account
      description: '`PROTOCOL.md` §6.5. `204` in an account or not.'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/{addr}/messages:
    parameters:
      - $ref: '#/components/parameters/addr'
    post:
      tags: [messages]
      operationId: send
      summary: Send a message to the box
      description: |
        `PROTOCOL.md` §4.5. The sender is the box whose pass the call carries;
        `addr` is the recipient. The ciphertext is an age file encrypted to the
        recipient's current prekey, with the signed envelope and its padding
        inside (§4.3, §4.4): the server is handed no signature. The same
        ciphertext posted again is `200` with the original receipt, whatever
        has changed at the recipient since. A refusal for a quota waits in the
        sender's outbox and is posted again after `Retry-After`;
        `403 sender_not_allowed` is final.
      parameters:
        - name: prekey_serial
          in: query
          required: true
          description: The serial of the prekey encrypted to. Not the recipient's current one is `409 stale_prekey`.
          schema:
            $ref: '#/components/schemas/SerialText'
        - name: certificate_serial
          in: query
          required: true
          description: The serial of the certificate that prekey's statement is signed under. A prekey is named by the two (`PROTOCOL.md` §2b).
          schema:
            $ref: '#/components/schemas/SerialText'
      requestBody:
        required: true
        description: The age file, binary, not armored (`PROTOCOL.md` §4.3), exactly as its sender wrote it. A server reads it as bytes whatever its `Content-Type` says.
        content:
          application/octet-stream: {}
      responses:
        '200':
          description: This ciphertext was stored before; the receipt is the original one.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '201':
          description: Stored. `Location` names the message made, which only the recipient may fetch.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [messages]
      operationId: list
      summary: List the box's mail
      description: |
        `PROTOCOL.md` §5.1. One page of up to 50, oldest first; pass
        `cursor` until `next_cursor` is null. `count` is every live message.
        An empty box is `{"count":0,"messages":[],"next_cursor":null}`.
        There is no long poll: a client polls, about every `Retry-After`
        seconds, the interval every list answer carries. A first page has an
        `ETag`; a poll that sends it back in `If-None-Match` is `304` while
        the page is unchanged, and takes from the poll rate all the same.
      parameters:
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the page before. Any other the server can read is answered as a poll; one it cannot read is `400` (§5.1).
          schema:
            $ref: '#/components/schemas/Cursor'
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a first page this box was answered; a client keeps only an empty box's (§5.1). Read as RFC 9110 §13.1.2 has a server evaluate it, `*` only as the whole value and each listed tag through its closing quote, and compared weakly.
          schema:
            type: string
      responses:
        '200':
          description: One page of the box's mail.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Retry-After:
              $ref: '#/components/headers/PollInterval'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '304':
          description: The first page is unchanged since the `ETag` the poll sent back, and it has no content (RFC 9110 §15.4.5).
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            Retry-After:
              $ref: '#/components/headers/PollInterval'
            ETag:
              description: The page's tag, the one the poll sent back; a `304` with another is no answer (§5.1).
              required: true
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/{addr}/messages/{id}:
    parameters:
      - $ref: '#/components/parameters/addr'
      - $ref: '#/components/parameters/id'
    get:
      tags: [messages]
      operationId: fetch
      summary: Fetch a message
      description: |
        `PROTOCOL.md` §5.2–§5.5. The answer is the ciphertext and nothing
        else: who sent it, on the server's word, and when, are in the list. A
        message is meant to be fetched once: past the box's budget,
        `429 fetch_paced` or `429 refetch_spent` (§5.7).
      responses:
        '200':
          description: The age file exactly as its sender posted it, of the `size` the list gave.
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
          content:
            application/octet-stream: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [messages]
      operationId: ack
      summary: Ack a message
      description: |
        `PROTOCOL.md` §5.7. Deletes the ciphertext; the server keeps a dedupe
        record until the message's `expires_at`. `404 no_such_message`: treat
        it as gone.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /to/{addr}:
    parameters:
      - name: addr
        in: path
        required: true
        description: A box's address, 64 lowercase hex characters. Any other path is `404`.
        schema:
          $ref: '#/components/schemas/Address'
    get:
      tags: [link]
      operationId: link
      summary: The page a box's link opens
      description: |
        `PROTOCOL.md` §2: fixed text, the address and this server's link to
        it, never text a box supplied, for a person or an agent handed the
        link. It reads no store, so it is served while the API still answers
        `503`. A client takes the address from the path and never fetches the
        page. A query a shared link picked up is ignored.
      security: []
      responses:
        '200':
          description: The page.
          headers:
            Referrer-Policy:
              required: true
              schema:
                const: no-referrer
            X-Robots-Tag:
              required: true
              schema:
                const: noindex
            Content-Security-Policy:
              description: The reference server's, which lets the page run nothing.
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                const: nosniff
            Cache-Control:
              description: How long a cache may keep the page; it is the same for every request.
              schema:
                type: string
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Not an address.
          content:
            text/plain:
              schema:
                type: string
        '429':
          description: '`rate_limited`: past the calls a server takes with no pass from the IP address the request comes from (§8).'
          headers:
            Date:
              $ref: '#/components/headers/Date'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - properties:
                      status:
                        const: 429
                      code:
                        const: rate_limited

components:
  securitySchemes:
    pass:
      type: http
      scheme: irongall-pass
      description: |
        A pass the box signs for itself with its working key, good for ten
        minutes (`PROTOCOL.md` §6.1b). A client writes it in exactly this form:
        `Authorization: irongall-pass address="<address>", not_after="<RFC 3339 UTC>", signature="<base64 of the SSHSIG>"`.
        A server reads it as RFC 9110 §11 lets a recipient: the scheme and
        the names in any case, the three parameters in any order, whitespace
        around each comma and `=`, each value a token or a quoted-string.
        The server issues nothing: there is no token. A `401` carries
        `WWW-Authenticate: irongall-pass`; on one, a client signs another pass
        and tries once more.

  parameters:
    addr:
      name: addr
      in: path
      required: true
      description: A box's address, 64 lowercase hex characters (`PROTOCOL.md` §2). Any other form, uppercase among them, is `400 bad_address`.
      schema:
        $ref: '#/components/schemas/Address'
    id:
      name: id
      in: path
      required: true
      description: A message id, the lowercase hex SHA-256 of its ciphertext. Any other form is `404 no_such_message`.
      schema:
        $ref: '#/components/schemas/MessageID'

  headers:
    Date:
      description: The time by the clock the server's checks read (`PROTOCOL.md` §0). A client sets it beside its own clock when a refusal is for a time, and never sets its clock by it.
      required: true
      schema:
        type: string
    Cache-Control:
      description: No answer under `/v1/` may be kept by a cache (`PROTOCOL.md` §6.3).
      required: true
      schema:
        const: no-store
    Content-Encoding:
      description: '`gzip`, only to a request whose `Accept-Encoding` takes it (RFC 9110 §8.4.1.3, §12.5.3): a box''s read is base64 in JSON, and a server may compress it (`PROTOCOL.md` §4.1). The answer is the JSON beneath.'
      required: false
      schema:
        const: gzip
    Vary:
      description: '`Accept-Encoding`, on an answer a server may compress, gzip or not (RFC 9110 §12.5.5).'
      required: false
      schema:
        const: Accept-Encoding
    Retry-After:
      description: How many seconds to wait before trying again, in digits alone (RFC 9110 §10.2.3's delay-seconds; never an HTTP-date, `PROTOCOL.md` §13).
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'
    PollInterval:
      description: A list's `Retry-After`, on every list answer, a `304` among them - the server's poll interval in seconds, in digits alone, as RFC 9773 §4.3 uses the field (`PROTOCOL.md` §5.1). A list answer without one breaks its form.
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'
    ETag:
      description: A first page's entity tag (RFC 9110 §8.8.3), opaque; a page after the first has none.
      required: false
      schema:
        type: string
    WWW-Authenticate:
      description: The scheme a call must use, `irongall-pass`, with any auth-params a server adds (RFC 9110 §11.6.1).
      required: true
      schema:
        type: string
        pattern: '^irongall-pass( .*)?$'
    Location:
      description: The message the send made, `/v1/<recipient>/messages/<id>` (RFC 9110 §15.3.2).
      required: true
      schema:
        type: string
        pattern: '^/v1/[0-9a-f]{64}/messages/[0-9a-f]{64}$'

  responses:
    Done:
      description: Done. The body is an empty object.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Empty'
    NoContent:
      description: Done.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
    ACL:
      description: The ACL as held, `*` first, then each address once, in ascending order of its hex.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ACL'
    BadRequest:
      description: |
        Not a request this call takes. `bad_request`: not a JSON text as §0b
        reads one; a missing or unknown member or query parameter, one given
        twice, or one whose value its call does not take (named in `member`) · `bad_address` · `bad_encoding` · `identity_mismatch` ·
        `unsupported_key_type` (with the server's `key_types`) · `bad_key` ·
        `prekey_not_new` · `prekey_time` · `not_age` · `wrong_recipient_type` ·
        `bad_revocation`. `PROTOCOL.md` §13 has what each means.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 400
                  code:
                    enum: [bad_request, bad_address, bad_encoding, identity_mismatch, unsupported_key_type, bad_key, prekey_not_new, prekey_time, not_age, wrong_recipient_type, bad_revocation]
    Unauthorized:
      description: |
        The pass is refused: `unauthorized` (none, not this box's, or not for
        this server) · `pass_expired` · `certificate_not_current` (with the
        current `certificate_serial` when the server has one) ·
        `certificate_revoked`. A client signs another pass and tries once more
        (§6.1b).
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 401
                  code:
                    enum: [unauthorized, pass_expired, certificate_not_current, certificate_revoked]
    Forbidden:
      description: |
        About the CALLING box: `unknown_sender` (not registered, or deleted) ·
        `sender_revoked` · `sender_not_allowed` (final) · `sender_key_type`
        (with the sender's `key_type`) · `adopt_key_refused`.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 403
                  code:
                    enum: [unknown_sender, sender_revoked, sender_not_allowed, sender_key_type, adopt_key_refused]
    NotFound:
      description: |
        `no_such_mailbox` (never registered, deleted, or forgotten) · `no_such_message`
        (acked or expired: treat it as gone) · `not_revoked` (the read of
        the revocations held, §6.3: the server holds none of this address).
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 404
                  code:
                    enum: [no_such_mailbox, no_such_message, not_revoked]
    Conflict:
      description: |
        `conflict` (what is held is newer, or another: with `version`,
        `prekey_serial` and `certificate_serial`, or `through`, as the call
        has one) · `box_changed` (send it again as it is) · `stale_prekey`
        (with the current `prekey_serial` and `certificate_serial`: read the
        box again and seal the same envelope to its prekey) · `prekey_expired` (the
        box's owner must renew).
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 409
                  code:
                    enum: [conflict, box_changed, stale_prekey, prekey_expired]
    Gone:
      description: |
        `revoked`: the box named is revoked, forever. A client checks the
        revocation and believes nothing less (§6.3): the read of a box carries
        it, so after any other call a client reads the box.
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 410
                  code:
                    const: revoked
    ContentTooLarge:
      description: '`too_large`, with the `limit` in bytes, or in entries for an ACL (bytes at a server that bounds no ACL''s entries).'
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 413
                  code:
                    const: too_large
    TooManyRequests:
      description: |
        Past a limit; wait out `Retry-After`. `rate_limited`, with
        `subject`, whom it was counted against, and `quota_id`, which limit,
        from a closed set (a limit counted by the day also with its `limit`)
        · `fetch_paced` and `refetch_spent` (a drain stops there, and it is
        no error) · `pair_full` (with `unacked` and `oldest_expires_at`) ·
        `mailbox_full` (with `count`) · `mailbox_busy`. What a server limits,
        and by how much, is its own (§8).
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 429
                  code:
                    enum: [rate_limited, fetch_paced, refetch_spent, pair_full, mailbox_full, mailbox_busy]
    Unavailable:
      description: '`unavailable`: the server is not ready to answer, and says so rather than answer wrong.'
      headers:
        Date:
          $ref: '#/components/headers/Date'
        Cache-Control:
          $ref: '#/components/headers/Cache-Control'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - properties:
                  status:
                    const: 503
                  code:
                    const: unavailable

  schemas:
    Integer:
      description: An integer in digits alone, from 0 to 2^53 − 1 (`PROTOCOL.md` §0b).
      type: integer
      minimum: 0
      maximum: 9007199254740991
    Serial:
      description: A serial, from 1 to 2^53 − 1 (`PROTOCOL.md` §2a, §2b).
      type: integer
      minimum: 1
      maximum: 9007199254740991
    Time:
      description: RFC 3339 UTC to the second (`PROTOCOL.md` §2a).
      type: string
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
    Address:
      description: A box's address, the lowercase hex SHA-256 of its identity document (`PROTOCOL.md` §2).
      type: string
      pattern: '^[0-9a-f]{64}$'
    MessageID:
      description: A message id, the lowercase hex SHA-256 of its ciphertext.
      type: string
      pattern: '^[0-9a-f]{64}$'
    Bytes:
      description: |
        A file's exact bytes, as standard base64 in its one encoding (RFC 4648
        §3): padded, no line break, the unused bits of the last character zero
        (`PROTOCOL.md` §0b).
      type: string
      contentEncoding: base64
      pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
    KeyTypes:
      description: |
        The identity key types the box's client verifies (`PROTOCOL.md` §2c):
        key type names, or the one entry `any`. `ssh-ed25519` is taken
        whatever is declared. Not signed. A server keeps the names it knows
        and ignores the rest.
      type: [array, 'null']
      items:
        type: string
    Empty:
      description: '`{}`.'
      type: object

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [identity, prekey, prekey_signature]
      properties:
        identity:
          description: The identity document (`PROTOCOL.md` §2), whose SHA-256 is the address.
          $ref: '#/components/schemas/Bytes'
        prekey:
          description: The first prekey statement (`PROTOCOL.md` §2a).
          $ref: '#/components/schemas/Bytes'
        prekey_signature:
          description: The statement's SSHSIG, armored, by a working key under a certificate of the identity (`PROTOCOL.md` §2b).
          $ref: '#/components/schemas/Bytes'
        sender_key_types:
          $ref: '#/components/schemas/KeyTypes'
    PrekeyRequest:
      type: object
      additionalProperties: false
      required: [prekey, prekey_signature]
      properties:
        prekey:
          description: The new prekey statement (`PROTOCOL.md` §2a).
          $ref: '#/components/schemas/Bytes'
        prekey_signature:
          description: Its SSHSIG, armored, by a working key under a certificate of the identity.
          $ref: '#/components/schemas/Bytes'
        sender_key_types:
          $ref: '#/components/schemas/KeyTypes'
    BoxResponse:
      description: |
        The one read of a box (`PROTOCOL.md` §4.1). A later version may add a
        member, as any answer may: a box's signed profile is the one named so
        far (§12), and no server sends it yet.
      type: object
      required: [identity, prekey, prekey_signature]
      dependentRequired:
        revoked_certificates: [revoked_certificates_signature]
        revoked_certificates_signature: [revoked_certificates]
      properties:
        identity:
          description: The identity document. A client checks that it hashes to the address.
          $ref: '#/components/schemas/Bytes'
        prekey:
          description: The current prekey statement.
          $ref: '#/components/schemas/Bytes'
        prekey_signature:
          description: Its SSHSIG, armored, carrying the certificate it is under.
          $ref: '#/components/schemas/Bytes'
        sender_key_types:
          $ref: '#/components/schemas/KeyTypes'
        revoked_certificates:
          description: The identity's revocation of its certificates through a serial, when this server holds one (`PROTOCOL.md` §6.3a), as a record carries it.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
        revoked_certificates_signature:
          description: The identity's SSHSIG over that statement, armored.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
    SerialText:
      description: 'A serial in a query, as a statement writes one (`PROTOCOL.md` §2a): digits, no leading zero, from 1 to 2^53 − 1.'
      type: string
      pattern: '^[1-9][0-9]{0,15}$'
    Cursor:
      description: A list's cursor, opaque and URL-safe (`PROTOCOL.md` §5.1).
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
    Receipt:
      type: object
      required: [id, received_at, expires_at]
      properties:
        id:
          description: The SHA-256 of the ciphertext. A sender checks it against what it posted.
          $ref: '#/components/schemas/MessageID'
        received_at:
          $ref: '#/components/schemas/Time'
        expires_at:
          description: When the server deletes the message, read or not, 33 days less an hour after it was received (`PROTOCOL.md` §7).
          $ref: '#/components/schemas/Time'
    MessageList:
      type: object
      required: [count, messages, next_cursor]
      properties:
        count:
          description: Every live message in the box.
          $ref: '#/components/schemas/Integer'
        messages:
          description: One page, oldest first by `received_at`.
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MessageInfo'
        next_cursor:
          description: The next page's cursor; null on the last page. A client refuses a list whose cursor is not of its form.
          anyOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
    MessageInfo:
      type: object
      required: [id, from, size, received_at, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/MessageID'
        from:
          description: The box whose pass the send carried, on the server's word. A client holds it to the sender it verifies.
          $ref: '#/components/schemas/Address'
        size:
          description: The ciphertext's size in bytes, which its fetch answers exactly.
          $ref: '#/components/schemas/Integer'
        received_at:
          $ref: '#/components/schemas/Time'
        expires_at:
          $ref: '#/components/schemas/Time'
    RevocationRecord:
      description: |
        A revocation record (`PROTOCOL.md` §6.3, §6.3a): a revocation of the
        address, of its certificates through a serial, or both. It proves
        itself: the document hashes to the address, and each signature is the
        identity's own: over the fixed statement of the revocation, which a
        reader rebuilds from the address, and over the statement of the
        revocation of certificates, which the record carries and a reader
        parses exactly. A reader takes one without `type`, and refuses one
        that names another type.
      type: object
      additionalProperties: false
      required: [identity]
      anyOf:
        - required: [revocation_signature]
        - required: [revoked_certificates]
      dependentRequired:
        revoked_certificates: [revoked_certificates_signature]
        revoked_certificates_signature: [revoked_certificates]
      properties:
        type:
          enum: [revocation_record, null]
        identity:
          description: The identity document.
          $ref: '#/components/schemas/Bytes'
        revocation_signature:
          description: The identity's SSHSIG over `irongall-revoke-v1\n<address>\n`, armored.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
        revoked_certificates:
          description: The statement `irongall-revoke-certs-v1\n<address>\n<serial>\n`.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
        revoked_certificates_signature:
          description: The identity's SSHSIG over that statement, armored.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
    RevocationRecordAnswer:
      description: A record as a server serves it, which names its type first.
      allOf:
        - $ref: '#/components/schemas/RevocationRecord'
        - required: [type]
          properties:
            type:
              const: revocation_record
    RevokedRecord:
      description: |
        The record a revoked address is answered with on the read of its box
        (`PROTOCOL.md` §6.3): always the revocation of the address, and the
        revocation of its certificates when the server holds one. It proves
        itself, as any record does.
      type: object
      required: [type, identity, revocation_signature]
      dependentRequired:
        revoked_certificates: [revoked_certificates_signature]
        revoked_certificates_signature: [revoked_certificates]
      properties:
        type:
          const: revocation_record
        identity:
          description: The identity document.
          $ref: '#/components/schemas/Bytes'
        revocation_signature:
          description: The identity's SSHSIG over `irongall-revoke-v1\n<address>\n`, armored.
          $ref: '#/components/schemas/Bytes'
        revoked_certificates:
          description: The statement `irongall-revoke-certs-v1\n<address>\n<serial>\n`.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
        revoked_certificates_signature:
          description: The identity's SSHSIG over that statement, armored.
          anyOf:
            - $ref: '#/components/schemas/Bytes'
            - type: 'null'
    ACLRequest:
      type: object
      additionalProperties: false
      required: [version, allow]
      properties:
        version:
          description: Above the version held, or `409 conflict`.
          $ref: '#/components/schemas/Serial'
        allow:
          description: '`["*"]` is everyone, `[]` nobody. Required, so an ACL always says whom it lets in.'
          type: array
          items:
            $ref: '#/components/schemas/ACLEntry'
        deny:
          description: Checked first. Left out or null, none.
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ACLEntry'
    ACL:
      type: object
      required: [version, allow, deny]
      properties:
        version:
          description: The version held; 0 for a box with none.
          $ref: '#/components/schemas/Integer'
        allow:
          type: array
          items:
            $ref: '#/components/schemas/ACLEntry'
        deny:
          type: array
          items:
            $ref: '#/components/schemas/ACLEntry'
    ACLEntry:
      description: An address, or `*`, which matches every address.
      type: string
      pattern: '^(\*|[0-9a-f]{64})$'
    AdoptRequest:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key:
          description: An adopt key an account minted (`PROTOCOL.md` §6.5). A secret.
          type: string
    AccountResponse:
      type: object
      required: [account]
      properties:
        account:
          description: The account's id, 1 to 32 of `a-z`, `0-9` and `-`.
          type: string
          pattern: '^[a-z0-9-]{1,32}$'

    Problem:
      description: |
        An error body: RFC 9457 Problem Details in AEP-193's form
        (`PROTOCOL.md` §13), with a member of its own for each value the error
        carries. `detail`, `hint` and `title` are a server's words, for a
        person reading the body; a client shows none of them, and says what the
        code means in its own words.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          description: '`tag:irongall.dev,2026-10-17:errors/<code>`, the code''s own: a name, the same at every server, which resolves to nothing (RFC 4151; `PROTOCOL.md` §13).'
          type: string
          pattern: '^tag:irongall\.dev,2026-10-17:errors/[a-z_]+$'
        title:
          type: string
        status:
          $ref: '#/components/schemas/Integer'
        detail:
          type: [string, 'null']
        code:
          description: One of the closed list under this status. A code a client does not know, one under another status, or one beside a `type` that is not its own, is no code.
          type: string
        hint:
          description: The fix as a client command, never a raw shell line.
          type: [string, 'null']
        limit:
          description: '`too_large`: the most bytes a body or a ciphertext may hold, or entries an ACL. `rate_limited` with a quota counted by the day: how many a day it takes.'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        quota_id:
          description: '`rate_limited`: which limit, from this closed set (§13), as Google''s `QuotaFailure` names one. A limit of a server''s own outside it names none. A client shows one it knows, and no other.'
          type: [string, 'null']
          enum: [polls, pages, calls, sends, renewals, certificates, certificate_revocations, registrations, registrations_range, misses, sends_before_pass, requests, null]
        subject:
          description: '`rate_limited`: whom the limit counted the call against, the box or the IP address it came from (§8).'
          type: [string, 'null']
          enum: [box, ip, null]
        count:
          description: '`mailbox_full`: how many messages the box holds, as its list counts them.'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        unacked:
          description: '`pair_full`: how many messages from this sender the box holds unacked.'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        oldest_expires_at:
          description: '`pair_full`: when the oldest of them expires.'
          anyOf:
            - $ref: '#/components/schemas/Time'
            - type: 'null'
        version:
          description: '`conflict` on an ACL: the version held.'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        prekey_serial:
          description: '`stale_prekey`: the box''s current prekey; `conflict` on a prekey: the serial a new one must be above.'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        certificate_serial:
          description: '`stale_prekey`, `conflict` on a prekey, `certificate_not_current`: the current certificate''s serial.'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        through:
          description: '`conflict` on a revocation of certificates: the serial the one held runs through.'
          anyOf:
            - $ref: '#/components/schemas/Integer'
            - type: 'null'
        key_types:
          description: '`unsupported_key_type`: the identity key types the server registers.'
          type: [array, 'null']
          items:
            type: string
        key_type:
          description: '`sender_key_type`: the sender''s key type, which the box''s client does not verify.'
          type: [string, 'null']
        member:
          description: '`bad_request`: the request member or query parameter that is missing, unknown or given twice, or holds a value its call does not take.'
          type: [string, 'null']
        record:
          description: '`revoked`, on the read of a box: the revocation record the server holds (§6.3). A client checks it, and believes nothing less.'
          anyOf:
            - $ref: '#/components/schemas/RevokedRecord'
            - type: 'null'
      allOf:
        - if:
            required: [code]
            properties:
              code:
                const: too_large
          then:
            required: [limit]
        - if:
            required: [code]
            properties:
              code:
                const: rate_limited
          then:
            required: [subject]
        - if:
            required: [quota_id]
            properties:
              quota_id:
                enum: [sends, renewals, certificates, certificate_revocations]
          then:
            required: [limit]
        - if:
            required: [code]
            properties:
              code:
                const: mailbox_full
          then:
            required: [count]
        - if:
            required: [code]
            properties:
              code:
                const: pair_full
          then:
            required: [unacked, oldest_expires_at]
        - if:
            required: [code]
            properties:
              code:
                const: stale_prekey
          then:
            required: [prekey_serial, certificate_serial]
        - if:
            required: [code]
            properties:
              code:
                const: unsupported_key_type
          then:
            required: [key_types]
        - if:
            required: [code]
            properties:
              code:
                const: sender_key_type
          then:
            required: [key_type]
